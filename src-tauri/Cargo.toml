[package]
name = "dsh-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "DSH Desktop - 原生 Windows 桌面壳（Tauri 2.x），属主管理 DSH 内核子进程"
authors = ["dsh-desktop team"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
